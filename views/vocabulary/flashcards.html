etten", "b": "<b>zette<\/b>", "sub": "present: zet"}, {"k": "grammar", "tags": ["Adjective endings: with or without -e"], "f": "Adjective endings: with or without -e", "sub": "1. Het gebruik van het adjectief", "b": "<p>een adjectief geeft informatie over een persoon of ding (nieuw, groot, klein, gestreept, groen, laag, rond, vierkant, rechthoekig; een vierkante tafel).<\/p>", "src": "data/grammar/adjective-endings-with-or-without-e.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Adjective endings: with or without -e"], "f": "Adjective endings: with or without -e", "sub": "2. Met of zonder -e", "b": "<ul><li><b>a. Na het substantief<\/b> (na het verbum <i>zijn<\/i>): nooit + -e. (De tafel is rond. De stoelen zijn nieuw.)<\/li><li><b>b. Voor het substantief<\/b>: eerst nadenken!<\/li><\/ul><p><b>de-woord of meervoud<\/b> → altijd + -e<\/p><p>een ronde tafel / de ronde tafel / ronde tafels / de ronde tafels; nieuwe stoelen / de nieuwe stoelen<\/p><p><b>het-woord<\/b> → + -e, behalve na <i>een<\/i> of / (= niets)<\/p><p>een rond tapijt / het ronde tapijt / ronde tapijten / de ronde tapijten<\/p>", "src": "data/grammar/adjective-endings-with-or-without-e.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Adjective endings: with or without -e"], "f": "Adjective endings: with or without -e", "sub": "3. Adjectieven die nooit -e krijgen", "b": "<ul><li><b>a.<\/b> eindigend op -en (het effen tapijt)<\/li><li><b>b.<\/b> materiaaladjectieven, meestal op -en (de houten stoel, de glazen salontafel, de lederen/leren driezit, de stoffen zetel, het ijzeren bed). Uitzondering: plastic (de plastic stoel).<\/li><li><b>c.<\/b> eindigend op -e (de roze zetel, het oranje tapijt)<\/li><\/ul>", "src": "data/grammar/adjective-endings-with-or-without-e.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Because: omdat and subordinate clauses"], "f": "Because: omdat and subordinate clauses", "sub": "One verb in the reason", "b": "<p>Move the conjugated verb to the end of the omdat clause.<\/p><p><b>Main clause + omdat + subject + other information + verb.<\/b><\/p><ul><li><b>Ik kan niet naar de les komen, omdat ik hoofdpijn heb.<\/b> — I can’t come to class because I have a headache.<\/li><\/ul><p>This combines the archive’s Asuka conversation with its instruction to use omdat.<\/p>", "src": "data/grammar/because-omdat-and-subordinate-clauses.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Because: omdat and subordinate clauses"], "f": "Because: omdat and subordinate clauses", "sub": "More than one verb", "b": "<p>Keep the verbs together at the end of the reason. The archive gives this exact model:<\/p><p><b>Ik kan morgen niet komen, omdat ik moet werken.<\/b><\/p><p>Here <b>moet werken<\/b> is the verb group. Learn this example as a pattern; do not move moet back into normal main-clause position after ik.<\/p>", "src": "data/grammar/because-omdat-and-subordinate-clauses.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Because: omdat and subordinate clauses"], "f": "Because: omdat and subordinate clauses", "sub": "Compare want and omdat", "b": "<p>Both can give a reason, but their word order differs.<\/p><ul><li><b>Ik kan niet komen, want ik heb hoofdpijn.<\/b><\/li><li><b>Ik kan niet komen, omdat ik hoofdpijn heb.<\/b><\/li><\/ul><p>The archive already contrasts want/omdat and includes <b>Ik heb hoofdpijn<\/b> in the message exercise.<\/p>", "src": "data/grammar/because-omdat-and-subordinate-clauses.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Comparisons: equal, comparative and superlative"], "f": "Comparisons: equal, comparative and superlative", "sub": "Regelmatige adjectieven", "b": "<table><tr><th>adjectief<th>=<th>comparatief<th>superlatief<\/tr><tr><td>oud<td>even oud als<td>ouder (dan)<td>de oudste cursist / het oudste kind<\/tr><tr><td>duur (adjectieven op -r)<td>even duur als<td>duurder (dan)<td>de duurste tunnel<\/tr><tr><td>zwaar (adjectieven op -r)<td>even zwaar als<td>zwaarder (dan)<td>de zwaarste pompoen<\/tr><tr><td>ruim<td>even ruim als<td>ruimer (dan)<td>de ruimste woonkamer<\/tr><tr><td>groot<td>even groot als<td>groter (dan)<td>de grootste<\/tr><tr><td>ver (adjectief op -r)<td>even ver als<td>verder (dan)<td>de verste<\/tr><\/table>", "src": "data/grammar/comparisons-equal-comparative-and-superlative.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Comparisons: equal, comparative and superlative"], "f": "Comparisons: equal, comparative and superlative", "sub": "Onregelmatige adjectieven", "b": "<table><tr><th>adjectief<th>=<th>comparatief<th>superlatief<\/tr><tr><td>veel<td>even veel als<td>meer (dan)<td>het meest<\/tr><tr><td>goed<td>even goed als<td>beter (dan)<td>het best<\/tr><tr><td>graag<td>even graag als<td>liever (dan)<td>het liefst<\/tr><tr><td>weinig<td>even weinig als<td>minder (dan)<td>het minst<\/tr><\/table>", "src": "data/grammar/comparisons-equal-comparative-and-superlative.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Comparisons: equal, comparative and superlative"], "f": "Comparisons: equal, comparative and superlative", "sub": "Pattern", "b": "<p><b>adjectief:<\/b> zwaar → <b>comparatief:<\/b> zwaarder (dan) → <b>superlatief:<\/b> de zwaarste pompoen<\/p><p>Illustraties: klein – kleiner – kleinst (hond, muis, vlieg); lang – langer – langst (haar).<\/p>", "src": "data/grammar/comparisons-equal-comparative-and-superlative.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Continuous aspect: zijn + aan het + infinitief"], "f": "Continuous aspect: zijn + aan het + infinitief", "sub": "Rule", "b": "<p>In Dutch, the construction <b>zijn + aan het + infinitief<\/b> expresses that an action is in progress at the exact moment of speaking, equivalent to the English present continuous (<i>to be doing something<\/i>).<\/p>", "src": "data/grammar/continuous-aspect-aan-het.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Continuous aspect: zijn + aan het + infinitief"], "f": "Continuous aspect: zijn + aan het + infinitief", "sub": "Structure in the main clause", "b": "<p>$$\\text{Subject} + \\mathbf{zijn} \\text{ (vervoegd)} + [\\text{object / plaats / bepaling}] + \\mathbf{aan\\ het} + \\mathbf{infinitief}$$<\/p><table><tr><th>Subject<th>Vervoeging van <i>zijn<\/i><th>Rest van de zin<th>Aan het + infinitief<\/tr><tr><td>Ik<td><b>ben<\/b><td><td><b>aan het koken<\/b>.<\/tr><tr><td>Wat<td><b>ben<\/b> jij<td>nu<td><b>aan het doen<\/b>?<\/tr><tr><td>Hij<td><b>is<\/b><td>in de tuin<td><b>aan het werken<\/b>.<\/tr><tr><td>Wij<td><b>zijn<\/b><td>oude familiefoto's<td><b>aan het bekijken<\/b>.<\/tr><tr><td>Zij (mv)<td><b>zijn<\/b><td>naar muziek<td><b>aan het luisteren<\/b>.<\/tr><\/table>", "src": "data/grammar/continuous-aspect-aan-het.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Continuous aspect: zijn + aan het + infinitief"], "f": "Continuous aspect: zijn + aan het + infinitief", "sub": "Inversion and questions", "b": "<p>When a time or place element is placed first, or in a closed question, normal inversion applies to the conjugated form of <i>zijn<\/i>:<\/p><ul><li><b>Nu<\/b> <b>ben<\/b> ik <b>aan het studeren<\/b>.<\/li><li><b>Waar<\/b> <b>ben<\/b> je <b>aan het wachten<\/b>?<\/li><li><b>Ben<\/b> je <b>aan het koken<\/b>?<\/li><\/ul>", "src": "data/grammar/continuous-aspect-aan-het.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Continuous aspect: zijn + aan het + infinitief"], "f": "Continuous aspect: zijn + aan het + infinitief", "sub": "Subordinate clauses (omdat, dat, als)", "b": "<p>In a subordinate clause, all verbal elements move to the end. <i>Aan het + infinitief<\/i> precedes the conjugated auxiliary <i>is / zijn<\/i>:<\/p><ul><li>Ik kan nu niet bellen, <b>omdat<\/b> ik <b>aan het rijden ben<\/b>.<\/li><li>Hij zegt <b>dat<\/b> hij <b>aan het studeren is<\/b>.<\/li><\/ul>", "src": "data/grammar/continuous-aspect-aan-het.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Continuous aspect: zijn + aan het + infinitief"], "f": "Continuous aspect: zijn + aan het + infinitief", "sub": "Contrast with English", "b": "<p>In standard Dutch, the simple present (<i>presens<\/i>) is also frequently used for ongoing actions when the context is obvious (\"Ik kook\" = <i>I cook<\/i> or <i>I am cooking<\/i>). Use <b>zijn + aan het + infinitief<\/b> specifically when emphasizing that the action is actively taking place right now or when interrupted.<\/p>", "src": "data/grammar/continuous-aspect-aan-het.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Future plans: gaan + infinitive"], "f": "Future plans: gaan + infinitive", "sub": "Pattern", "b": "<p><b>Subject + gaan + other information + infinitive.<\/b><\/p><ul><li><b>Ik ga winkelen.<\/b> — I’m going to go shopping.<\/li><li><b>Wij gaan winkelen.<\/b> — We’re going to go shopping.<\/li><li><b>Morgen gaan we winkelen.<\/b> — Tomorrow we’re going shopping. This last sentence is supplied in the archive.<\/li><\/ul>", "src": "data/grammar/future-plans-gaan-infinitive.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Future plans: gaan + infinitive"], "f": "Future plans: gaan + infinitive", "sub": "Choose the right form", "b": "<ul><li><b>ik ga<\/b><\/li><li><b>jij/je gaat, u gaat, hij/zij gaat<\/b><\/li><li><b>wij/we, jullie, zij/ze gaan<\/b><\/li><\/ul><p>In a question with jij/je after the verb, drop the -t: <b>Ga je winkelen?<\/b><\/p><p>When <b>morgen<\/b> comes first, swap the verb and subject: <b>Morgen gaan we …<\/b>. Keep the infinitive at the end. Use the same pattern for the archive’s unfinished Mercator prompt; the missing photo means its exact intended answer cannot be recovered.<\/p>", "src": "data/grammar/future-plans-gaan-infinitive.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Infinitive clauses: om te + infinitief"], "f": "Infinitive clauses: om te + infinitief", "sub": "Rule", "b": "<p>The construction <b>om ... te + infinitief<\/b> expresses purpose, intention, or goal (equivalent to English <i>in order to<\/i> or <i>to + verb<\/i>), answering the question <b>Waarom?<\/b> (<i>Why?<\/i>).<\/p><p>It is also used after fixed verbs, adjectives, and expressions of necessity or importance.<\/p>", "src": "data/grammar/infinitive-clauses-om-te.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Infinitive clauses: om te + infinitief"], "f": "Infinitive clauses: om te + infinitief", "sub": "Structure", "b": "<p>$$\\text{Hoofdzin} + \\mathbf{om} + [\\text{objecten / bepalingen}] + \\mathbf{te} + \\mathbf{infinitief}$$<\/p><p>The word <b>om<\/b> introduces the infinitive clause, other elements (objects, complements, time/place) come in between, and <b>te + infinitief<\/b> closes the clause at the very end.<\/p><table><tr><th>Hoofdzin<th>om<th>Tussenliggende zinsdelen<th>te + infinitief<\/tr><tr><td>Ik bel<td><b>om<\/b><td>mijn afspraak<td><b>te verzetten<\/b>.<\/tr><tr><td>Ik ga naar de markt<td><b>om<\/b><td>verse aardbeien<td><b>te kopen<\/b>.<\/tr><tr><td>Hij neemt de trein<td><b>om<\/b><td>de file<td><b>te vermijden<\/b>.<\/tr><tr><td>Het is belangrijk<td><b>om<\/b><td>de dokter tijdig<td><b>te verwittigen<\/b>.<\/tr><tr><td>Het is leuk<td><b>om<\/b><td>samen met vrienden<td><b>te koken<\/b>.<\/tr><\/table>", "src": "data/grammar/infinitive-clauses-om-te.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Infinitive clauses: om te + infinitief"], "f": "Infinitive clauses: om te + infinitief", "sub": "Separable verbs (separabele verba)", "b": "<p>With separable verbs, the word <b>te<\/b> is placed <b>between<\/b> the separable prefix (particle) and the verb stem + -en:<\/p><p>$$\\text{partikel} + \\mathbf{te} + \\text{infinitief}$$<\/p><ul><li><b>opbellen<\/b>: \"Ik bel om mijn oma <b>op te bellen<\/b>.\"<\/li><li><b>meenemen<\/b>: \"Het is handig om een herbruikbare zak <b>mee te nemen<\/b>.\"<\/li><li><b>uitstappen<\/b>: \"Vergeet niet om bij de volgende halte <b>uit te stappen<\/b>.\"<\/li><\/ul>", "src": "data/grammar/infinitive-clauses-om-te.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Infinitive clauses: om te + infinitief"], "f": "Infinitive clauses: om te + infinitief", "sub": "Common communicative triggers in Zo gezegd 1.2", "b": "<p>1. <b>Telefonisch een afspraak beheren<\/b>:<\/p><ul><li>\"Ik bel <b>om<\/b> een afspraak <b>te maken<\/b>.\"<\/li><li>\"Ik bel <b>om<\/b> de afspraak naar volgende week <b>te verzetten<\/b>.\"<\/li><li>\"Ik bel <b>om<\/b> te vragen of de dokter spreekuur heeft.\"<\/li><\/ul><p>2. <b>Advies en noodzaak<\/b>:<\/p><ul><li>\"Het is beleefd <b>om<\/b> even <b>te verwittigen<\/b> als je te laat bent.\"<\/li><li>\"Vergeet niet <b>om<\/b> het kasticket <b>te bewaren<\/b>.\"<\/li><\/ul>", "src": "data/grammar/infinitive-clauses-om-te.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Joining sentences: want, en, maar and of"], "f": "Joining sentences: want, en, maar and of", "sub": "Rule", "b": "<p><b>Nevenschikking (want, en, maar, of)<\/b>: na <i>want<\/i> (reden: waarom?), <i>maar<\/i> (tegenstelling) en <i>of<\/i> (keuze) verandert de woordvolgorde van de zin niet.<\/p><p><b>Patroon:<\/b> hoofdzin + <b>want / en / maar / of<\/b> + hoofdzin met gewone woordvolgorde<\/p><p>Wij gaan verhuizen, <b>want<\/b> ons appartement <b>is<\/b> te klein.<\/p><ul><li>Wij gaan verhuizen. Ons appartement is te klein. → Wij gaan verhuizen, want ons appartement is te klein.<\/li><li>We hebben een ruimere woonkamer en we hebben nu 3 slaapkamers.<\/li><li>Wij wonen ver van het werk, maar we hebben een auto.<\/li><\/ul>", "src": "data/grammar/joining-sentences-want-en-maar-and-of.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Modal verbs: can, must, may and want"], "f": "Modal verbs: can, must, may and want", "sub": "Rule", "b": "<p><b>Modale verba: kunnen, moeten, mogen, willen + infinitief<\/b><\/p>", "src": "data/grammar/modal-verbs-can-must-may-and-want.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Modal verbs: can, must, may and want"], "f": "Modal verbs: can, must, may and want", "sub": "Zinsbouw", "b": "<p><b>Zinspatroon:<\/b> <b>subject<\/b> + <b>modaal verbum<\/b> + … + <b>infinitief<\/b> aan het einde<\/p><p><b>Maria<\/b> <b>wil<\/b> naar het buurtfeest <b>gaan<\/b>.<\/p><table><tr><th><th>kunnen<th>moeten<th>mogen<th>willen<\/tr><tr><td>ik<td>kan<td>moet<td>mag<td>wil<\/tr><tr><td>jij/je<td>kan / kunt<td>moet<td>mag<td>wil / wilt<\/tr><tr><td>u<td>kan / kunt<td>moet<td>mag<td>wil / wilt<\/tr><tr><td>hij, zij/ze<td>kan<td>moet<td>mag<td>wil<\/tr><tr><td>wij/we<td>kunnen<td>moeten<td>mogen<td>willen<\/tr><tr><td>jullie<td>kunnen<td>moeten<td>mogen<td>willen<\/tr><tr><td>zij/ze<td>kunnen<td>moeten<td>mogen<td>willen<\/tr><\/table>", "src": "data/grammar/modal-verbs-can-must-may-and-want.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Modal verbs: can, must, may and want"], "f": "Modal verbs: can, must, may and want", "sub": "Betekenis en voorbeelden", "b": "<table><tr><th>Verbum + infinitief<th>Betekenis<th>Voorbeeld<\/tr><tr><td>kunnen<td>vaardigheid<td>Mijn dochter kan zwemmen.<\/tr><tr><td>kunnen<td>mogelijkheid<td>Je kan je oude kleding in een zak op straat zetten.<\/tr><tr><td>moeten<td>noodzaak<td>Maria krijgt bezoek. Ze moet boodschappen doen.<\/tr><tr><td>moeten<td>verplichting<td>Het licht is rood, je moet stoppen.<\/tr><tr><td>(niet) mogen<td>toelating<td>Het licht is groen, je mag oversteken.<\/tr><tr><td>(niet) mogen<td>verbod<td>Je mag hier niet parkeren.<\/tr><tr><td>willen<td>wens<td>Maria wil naar het buurtfeest gaan.<\/tr><\/table>", "src": "data/grammar/modal-verbs-can-must-may-and-want.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Negation: geen and niet"], "f": "Negation: geen and niet", "sub": "Rule", "b": "<p><b>Negatie met geen<\/b><\/p><ul><li>een + substantief → geen: Er is een lift. → Er is geen lift.<\/li><li>substantief zonder lidwoord → geen: Er is centrale verwarming. → Er is geen centrale verwarming.<\/li><\/ul><p><b>Negatie met niet<\/b><\/p><ul><li>vóór <i>elke dag<\/i>, <i>graag<\/i> → niet: Ik neem elke dag de bus. → Ik neem niet elke dag de bus. / Ik woon graag in het centrum. → Ik woon niet graag in het centrum.<\/li><li>vóór een prepositie → niet: Ik woon op de derde verdieping. → Ik woon niet op de derde verdieping.<\/li><\/ul>", "src": "data/grammar/negation-geen-and-niet.md", "r": "reviewed"}, {"k": "grammar", "tags": ["The perfect tense (perfectum)"], "f": "The perfect tense (perfectum)", "sub": "Rule", "b": "<p><b>Subject + present tense of hebben or zijn + other information + past participle.<\/b><\/p><ul><li><b>We hebben gewinkeld.<\/b> — We went shopping.<\/li><li><b>We hebben mosselen gegeten.<\/b> — We ate mussels.<\/li><li><b>We zijn naar het museum geweest.<\/b> — We went to the museum.<\/li><li><b>Ik heb mijn paraplu teruggevonden.<\/b> — I found my umbrella again.<\/li><\/ul><p>The archive supplies these patterns and an irregular-verb list. Learn each verb together with its auxiliary and participle: <b>eten → hebben gegeten<\/b>, <b>gaan → zijn gegaan<\/b>, <b>vinden → hebben gevonden<\/b>. Do not assume every verb uses hebben. Some verbs in the archive, such as zwemmen, allow hebben or zijn depending on the meaning.<\/p>", "src": "data/grammar/the-perfect-tense-perfectum.md", "r": "reviewed"}, {"k": "grammar", "tags": ["The perfect tense (perfectum)"], "f": "The perfect tense (perfectum)", "sub": "With a time phrase", "b": "<p>The conjugated auxiliary stays in second position; the participle stays near the end.<\/p><ul><li><b>Gisteren hebben we gewinkeld.<\/b><\/li><li><b>Eerst zijn we naar het museum geweest.<\/b><\/li><\/ul><p>For a question, put the auxiliary first: <b>Heb je mijn bericht al gelezen?<\/b> — Have you read my message yet?<\/p>", "src": "data/grammar/the-perfect-tense-perfectum.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Using er: there is / there are"], "f": "Using er: there is / there are", "sub": "Rule", "b": "<p><b>Er als voorlopig subject<\/b>: als het echte subject niet specifiek is (met <i>een<\/i>, <i>geen<\/i>, zonder lidwoord, met een telwoord) en verder in de zin staat, kan de zin beginnen met <i>er<\/i> (vaak in beschrijvingen).<\/p><p><b>Patroon:<\/b> <b>Er<\/b> + <b>is / zijn<\/b> + niet-specifiek subject + rest van de zin<\/p><p><b>Er<\/b> <b>zijn<\/b> twee slaapkamers. · <b>Er<\/b> <b>is<\/b> geen berging.<\/p><ul><li>Er is een badkamer met douche.<\/li><li>Er is geen berging.<\/li><li>Er is centrale verwarming.<\/li><li>Er zijn twee slaapkamers.<\/li><\/ul>", "src": "data/grammar/using-er-there-is-there-are.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Using er: there is / there are"], "f": "Using er: there is / there are", "sub": "Er with position verbs (staan, liggen, hangen)", "b": "<p>In oral descriptions (Modeling 5), <i>er<\/i> is frequently paired with verbs of physical position rather than just <i>is / zijn<\/i>:<\/p><p>$$\\mathbf{Er} + \\mathbf{staat / ligt / hangt} + \\text{onbepaald subject} + \\text{locatie}$$<\/p><ul><li><b>Er staat<\/b> een houten tafel in het midden van de living.<\/li><li><b>Er ligt<\/b> een mooi tapijt onder de salontafel.<\/li><li><b>Er hangt<\/b> een ronde spiegel boven de lavabo.<\/li><li><b>Er liggen<\/b> boeken op het nachtkastje.<\/li><li><b>Wat staat er<\/b> in de hoek? — <b>Er staat<\/b> een vloerlamp.<\/li><\/ul>", "src": "data/grammar/using-er-there-is-there-are.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Using zal"], "f": "Using zal", "sub": "Pattern", "b": "<p><b>Subject + zal/zullen + other information + infinitive.<\/b><\/p><ul><li><b>ik zal; hij/zij zal<\/b><\/li><li><b>jij/je zal or zult; u zal or zult<\/b><\/li><li><b>wij/we, jullie, zij/ze zullen<\/b><\/li><\/ul><p>In <b>Dat zal ik doen<\/b>, <b>dat<\/b> comes first, so the conjugated verb <b>zal<\/b> comes before the subject <b>ik<\/b>. <b>Doen<\/b> is the infinitive at the end.<\/p>", "src": "data/grammar/using-zal.md", "r": "reviewed"}, {"k": "grammar", "tags": ["Word order: eerst, dan and daarna"], "f": "Word order: eerst, dan and daarna", "sub": "Word order", "b": "<p>A Dutch main clause normally puts its conjugated verb in second position. If a time word or phrase comes first, the subject follows that verb.<\/p><p><b>Time phrase + conjugated verb + subject + rest of sentence.<\/b><\/p><ul><li><b>Eerst zijn we naar het museum geweest.<\/b> — First we went to the museum.<\/li><li><b>Daarna hebben we gewinkeld.<\/b> — After that we went shopping.<\/li><li><b>Dan hebben we mosselen gegeten.<\/b> — Then we ate mussels.<\/li><\/ul><p>These three examples come from the archived exercise tips. Notice that <b>zijn/hebben<\/b> move before <b>we<\/b>; <b>geweest/gewinkeld/gegeten<\/b> remain at the end.<\/p>", "src": "data/grammar/word-order-eerst-dan-and-daarna.md", "r": "reviewed"}];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let deck=[],known=0,shown=false;
function opts(){
 const k=$('kind').value,f=$('filter');f.innerHTML='';
 const add=(v,t)=>f.add(new Option(t,v));
 add('','All');
 if(k==='vocab'){
  const tags={};ALL.filter(c=>c.k==='vocab').forEach(c=>c.tags.forEach(t=>tags[t]=(tags[t]||0)+1));
  const types=['Nouns','Verbs','Adjectives','Prepositions','Phrases','Other'];
  const g1=document.createElement('optgroup');g1.label='By word type';
  types.filter(t=>tags[t]).forEach(t=>g1.appendChild(new Option(t+' ('+tags[t]+')',t)));f.appendChild(g1);
  const g2=document.createElement('optgroup');g2.label='By chapter';
  Object.keys(tags).filter(t=>t.startsWith('Chapter ')).sort().forEach(t=>g2.appendChild(new Option(t+' ('+tags[t]+')',t)));f.appendChild(g2);
  const g3=document.createElement('optgroup');g3.label='By theme';
  Object.keys(tags).filter(t=>!types.includes(t)&&!t.startsWith('Chapter ')).sort().forEach(t=>g3.appendChild(new Option(t+' ('+tags[t]+')',t)));f.appendChild(g3);
 }else if(k==='grammar'){
  [...new Set(ALL.filter(c=>c.k==='grammar').map(c=>c.f))].sort().forEach(t=>add(t,t));
 }
 $('dirL').style.display=k==='vocab'?'':'none';
 f.style.display=(k==='perfectum'||k==='imperfectum')?'none':'';
 start();
}
function start(){
 const k=$('kind').value,flt=$('filter').value,nr=$('nr').checked;
 deck=ALL.filter(c=>c.k===k&&(nr||c.r!=='needs-review')&&(!flt||c.tags.includes(flt)));
 if($('ord').value==='r')for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
 known=0;shown=false;draw();
}
function faces(c){
 const k=c.k,flag=c.r==='needs-review'?'<div class="tiny flag">not yet reviewed</div>':'';
 if(k==='vocab'){
  const nl=(c.art?c.art+' ':'')+c.nl,rev=$('dir').value==='en';
  const front=rev?c.en:nl,back=rev?nl:c.en;
  return [`<div class="big">${esc(front)}</div>`,
   `<div class="big">${esc(back)}</div>`+(rev?'':'')+(c.ex?`<div class="sub">${esc(c.ex)}</div>`:'')+(c.forms?`<div class="sub">${esc(c.forms)}</div>`:'')+`<div class="tiny">${c.id}</div>`+flag];
 }
 if(k==='perfectum'||k==='imperfectum')
  return [`<div class="big">${esc(c.f)}</div><div class="sub">${esc(c.en)}</div><div class="tiny">${k==='perfectum'?'perfectum: heeft/is + participle':'imperfectum (singular)'}</div>`,
   `<div class="big">${c.b}</div>${c.sub?`<div class="sub">${c.sub}</div>`:''}<div class="sub">${esc(c.f)} — ${esc(c.en)}</div><div class="tiny">${c.id}</div>`+flag];
 return [`<div class="big">${esc(c.sub)}</div><div class="sub">${esc(c.f)}</div>`,
  `<div class="back">${c.b}</div><div class="tiny">${c.src}</div>`+flag];
}
function draw(){
 const card=$('card');
 if(!deck.length){card.innerHTML=known?`<div class="big">Done 🎉</div><div class="sub">${known} cards known</div>`:'<div class="sub">No cards for this selection.</div>';$('st').textContent='';return}
 const f=faces(deck[0]);card.innerHTML=shown?f[1]:f[0]+'<div class="tiny">tap to flip</div>';
 $('st').textContent=deck.length+' left · '+known+' known';
}
const flip=()=>{if(deck.length){shown=!shown;draw()}};
function next(ok){if(!deck.length)return;const c=deck.shift();if(ok)known++;else deck.push(c);shown=false;draw()}
$('card').onclick=$('flip').onclick=flip;$('got').onclick=()=>next(1);$('again').onclick=()=>next(0);
['filter','dir','ord','nr'].forEach(i=>$(i).onchange=start);$('kind').onchange=opts;
document.onkeydown=e=>{if(e.target.tagName==='SELECT')return;if(e.key===' '){e.preventDefault();flip()}else if(e.key==='ArrowRight')next(1);else if(e.key==='ArrowLeft')next(0)};
opts();
</script></body></html>
